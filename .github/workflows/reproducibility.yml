name: Reproducibility check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  empirical-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install locked environment
        run: python -m pip install --require-hashes -r requirements-lock.txt

      - name: Compile Python sources
        run: python -m compileall -q src

      - name: Validate publication metadata and local links
        run: python scripts/check_publication.py

      - name: Run empirical pipeline
        env:
          MPLBACKEND: Agg
        run: python src/run_pipeline.py

      - name: Confirm publication outputs
        run: |
          test -f docs/analysis_results.md
          test "$(find figures/analysis -maxdepth 1 -name '*.png' | wc -l)" -eq 12
